<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function () {
  try {
    var t = localStorage.getItem('dashboard:theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Julian's Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="lock.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --surface-1: #050506;
  --surface-2: #121214;
  --inset-bg: rgba(0,0,0,0.30);
  --line: rgba(255,255,255,0.09);
  --line-soft: rgba(255,255,255,0.06);
  --text-primary: #FAFAFA;
  --text-secondary: #A5A3A0;
  --text-tertiary: #6E6C68;
  --success: #17E88F;
  --warning: #FFC93C;
  --danger: #FF4D5E;
  --shadow-card: 0 14px 34px rgba(0,0,0,0.45);
  --title-grad-a: #FFFFFF;
  --title-grad-b: #C7C4BC;
  --btn-primary-a: #FFFFFF;
  --btn-primary-b: #E8E5DD;
  --btn-primary-text: #0A0A0B;
  --glow-opacity: 1;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

:root[data-theme="light"] {
  --surface-1: #F3F3F1;
  --surface-2: #FFFFFF;
  --inset-bg: rgba(0,0,0,0.035);
  --line: rgba(15,15,20,0.10);
  --line-soft: rgba(15,15,20,0.07);
  --text-primary: #141416;
  --text-secondary: #55545C;
  --text-tertiary: #8B8A90;
  --shadow-card: 0 10px 26px rgba(20,20,26,0.08);
  --title-grad-a: #141416;
  --title-grad-b: #4A4952;
  --btn-primary-a: #141416;
  --btn-primary-b: #2B2A30;
  --btn-primary-text: #FAFAFA;
  --glow-opacity: 0.35;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--surface-1);
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
  transition: background 0.3s, color 0.3s;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(23, 232, 143, 0.14), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  opacity: var(--glow-opacity);
  pointer-events: none;
  z-index: -2;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  opacity: var(--glow-opacity);
  pointer-events: none;
  z-index: -1;
}
@keyframes drift {
  0%   { transform: translate3d(0,0,0); }
  100% { transform: translate3d(-22px, 14px, 0); }
}

.page {
  max-width: 1100px;
  margin: 0 auto;
}

/* ===== Header ===== */
.dash-header {
  margin-bottom: 14px;
}
.dash-title {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.03em;
  text-transform: uppercase;
  background: linear-gradient(180deg, var(--title-grad-a) 0%, var(--title-grad-b) 120%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 23px; } }

/* ===== Bento grid ===== */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  gap: 14px;
  grid-auto-flow: dense;
  margin-top: 20px;
}

.bento-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 20px;
  border-radius: 18px;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
.bento-tile:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: var(--shadow-card), 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
}
.bento-tile.big  { grid-column: span 2; grid-row: span 2; }
.bento-tile.wide { grid-column: span 2; }

.bento-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
}
.bento-emoji {
  position: absolute;
  top: 18px; right: 18px;
  font-size: 28px;
  line-height: 1;
  filter: drop-shadow(0 0 12px var(--accent));
}
.bento-spacer { flex: 1; }
.bento-title {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  margin-top: 2px;
}
.bento-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
}
.bento-sub {
  font-size: 12px;
  color: var(--text-tertiary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.bento-arrow {
  flex-shrink: 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  transition: transform 0.2s ease;
}
.bento-tile:hover .bento-arrow { transform: translateX(4px); }

@media (max-width: 720px) {
  .bento-grid { grid-template-columns: repeat(2, 1fr); }
  .bento-tile.big { grid-row: span 1; }
}
@media (max-width: 440px) {
  .bento-grid { grid-template-columns: 1fr; }
  .bento-tile.big, .bento-tile.wide { grid-column: span 1; }
}
</style>
</head>
<body>
<div class="page">

  <div class="dash-header">
    <h1 class="dash-title">Dashboard</h1>
  </div>

  <div class="bento-grid">
    <a href="main.html" class="bento-tile big" style="--accent:#6BE3A4">
      <span class="bento-num">·01</span>
      <span class="bento-emoji">🏠</span>
      <span class="bento-spacer"></span>
      <span class="bento-title">Main</span>
      <span class="bento-footer">
        <span class="bento-sub">Goals &amp; daily plan</span>
        <span class="bento-arrow">→</span>
      </span>
    </a>

    <a href="gym.html" class="bento-tile wide" style="--accent:#7DD3FC">
      <span class="bento-num">·02</span>
      <span class="bento-emoji">💪</span>
      <span class="bento-spacer"></span>
      <span class="bento-title">Fitness</span>
      <span class="bento-footer">
        <span class="bento-sub">Workouts, splits, sessions</span>
        <span class="bento-arrow">→</span>
      </span>
    </a>

    <a href="health.html" class="bento-tile" style="--accent:#A7F3D0">
      <span class="bento-num">·03</span>
      <span class="bento-emoji">💊</span>
      <span class="bento-spacer"></span>
      <span class="bento-title">Health</span>
      <span class="bento-footer">
        <span class="bento-sub">Supplements &amp; vitals</span>
        <span class="bento-arrow">→</span>

    <a href="po-water.html" class="bento-tile" style="--accent:#60A5FA">
      <span class="bento-num">·04</span>

      <span class="bento-spacer"></span>

      <span class="bento-footer">

        <span class="bento-arrow">→</span>

    <a href="finance.html" class="bento-tile wide" style="--accent:#F2C063">

      <span class="bento-emoji">📊</span>
      <span class="bento-spacer"></span>
      <span class="bento-title">Finance</span>
      <span class="bento-footer">

        <span class="bento-arrow">→</span>
      </span>
    </a>

    <a href="cronometer.html" class="bento-tile" style="--accent:#C4B5FD">
      <span class="bento-num">·06</span>

      </span>
    </a>
  </div>

</div>
</body>
</html>
