<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Not deferred, on purpose, and first — before even the theme
     script below: lock.js must hide the page and decide whether to
     show a PIN screen BEFORE anything else renders. See lock.js's
     own header comment for the full reasoning (same load-order
     lesson as daylib.js/RowIcons, applied to something that actually
     needs to block, not just be ready in time). -->
<script src="lock.js"></script>
<script>
(function () {
  try {
    var t = localStorage.getItem('dashboard:theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Not deferred, on purpose (matches gym.html's, main.html's, and
     health.html's daylib.js tag exactly) — see daylib.js's own header
     comment. This page's own script is DOMContentLoaded-wrapped so it
     doesn't strictly need this, but every other page loads daylib.js
     this way and there's no reason for this one to be the exception. -->
<script src="daylib.js"></script>
<script src="https://unpkg.com/lucide@1.43.0/dist/umd/lucide.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --surface-1: #050506;
  --surface-2: #121214;
  --inset-bg: rgba(0,0,0,0.30);
  --line: rgba(255,255,255,0.09);
  --line-soft: rgba(255,255,255,0.06);
  --text-primary: #FAFAFA;
  --text-secondary: #A5A3A0;
  --text-tertiary: #6E6C68;
  --success: #17E88F;
  --warning: #FFC93C;
  --danger: #FF4D5E;
  --shadow-card: 0 14px 34px rgba(0,0,0,0.45);
  --title-grad-a: #FFFFFF;
  --title-grad-b: #C7C4BC;
  --btn-primary-a: #FFFFFF;
  --btn-primary-b: #E8E5DD;
  --btn-primary-text: #0A0A0B;
  --glow-opacity: 1;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="light"] {
  --surface-1: #F3F3F1;
  --surface-2: #FFFFFF;
  --inset-bg: rgba(0,0,0,0.035);
  --line: rgba(15,15,20,0.10);
  --line-soft: rgba(15,15,20,0.07);
  --text-primary: #141416;
  --text-secondary: #55545C;
  --text-tertiary: #8B8A90;
  --shadow-card: 0 10px 26px rgba(20,20,26,0.08);
  --title-grad-a: #141416;
  --title-grad-b: #4A4952;
  --btn-primary-a: #141416;
  --btn-primary-b: #2B2A30;
  --btn-primary-text: #FAFAFA;
  --glow-opacity: 0.35;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--surface-1);
  color: var(--text-secondary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
  transition: background 0.3s, color 0.3s;
}
body {
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 82% 14%, rgba(23, 232, 143, 0.14), transparent 45%),
    radial-gradient(circle at 18% 90%, rgba(180, 180, 200, 0.06), transparent 50%);
  filter: blur(40px);
  opacity: var(--glow-opacity);
  pointer-events: none;
  z-index: -2;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  opacity: var(--glow-opacity);
  pointer-events: none;
  z-index: -1;
}
.page { max-width: 700px; margin: 0 auto; }
.dash-header { margin-bottom: 14px; }
/* Shared history-navigation pattern (Phase E) — identical rules to
   health.html's Cronometer section, same generic class names on
   purpose so the pattern reads identically across every section this
   phase touches. */
.day-nav { display: flex; align-items: center; gap: 4px; min-width: 0; margin-bottom: 6px; }
.day-nav-btn {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px;
  background: transparent; border: 1px solid var(--line);
  color: var(--text-tertiary); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: color 0.15s, border-color 0.15s;
}
.day-nav-btn:hover { color: var(--text-primary); border-color: var(--text-tertiary); }
.day-nav-btn:disabled { opacity: 0.35; cursor: default; }
.day-nav-btn:disabled:hover { color: var(--text-tertiary); border-color: var(--line); }
.day-nav-label {
  min-width: 0; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: inherit; font-size: 13px; font-weight: 700; color: var(--text-primary);
  padding: 0 4px;
}
.dash-eyebrow {
  font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 800;
  letter-spacing: 0.20em; text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 6px;
}
.dash-title {
  margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase;
  background: linear-gradient(180deg, var(--title-grad-a) 0%, var(--title-grad-b) 120%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
}
.section { margin-top: 22px; }
.section-title {
  font-size: 10.5px; font-weight: 800;
  letter-spacing: 0.20em; text-transform: uppercase;
  color: var(--text-tertiary);
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 12px;
}
.section-title::before { content: ''; width: 18px; height: 1px; background: var(--text-tertiary); opacity: 0.6; }
.section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.gm-card {
  position: relative;
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-radius: 18px;
  padding: 20px;
  box-shadow: var(--shadow-card);
}

.habits-summary-row { display: flex; align-items: center; gap: 18px; }
.habits-summary-pct {
  font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em; color: var(--success); flex-shrink: 0;
}
.habits-summary-text { min-width: 0; }
.habits-summary-title { font-size: 15px; font-weight: 700; color: var(--text-primary); }
.habits-summary-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 3px; }

.save-btn-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.save-btn {
  padding: 11px 22px; border: 0; border-radius: 12px;
  background: linear-gradient(180deg, var(--btn-primary-a) 0%, var(--btn-primary-b) 100%);
  color: var(--btn-primary-text);
  font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
  transition: transform 0.1s, filter 0.15s;
}
.save-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.save-btn:active { transform: translateY(0); }
.save-btn:disabled { opacity: 0.5; cursor: default; }
.save-confirm { font-size: 12.5px; font-weight: 700; color: var(--success); opacity: 0; transition: opacity 0.3s ease; }
.save-confirm.show { opacity: 1; }

/* nightly entry rows */
.entry-habit-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 11px 0; border-bottom: 1px solid var(--line-soft);
}
.entry-habit-row:last-child { border-bottom: none; }
.entry-habit-label { font-size: 13.5px; color: var(--text-primary); }
.entry-habit-label small { display: block; font-size: 10.5px; color: var(--text-tertiary); font-weight: 400; margin-top: 2px; }
.entry-habit-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.entry-btn {
  min-width: 34px; height: 30px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--inset-bg);
  color: var(--text-secondary); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
}
.entry-btn.active { background: linear-gradient(180deg, var(--btn-primary-a), var(--btn-primary-b)); color: var(--btn-primary-text); border-color: transparent; }
.entry-btn.na-btn { color: var(--text-tertiary); font-weight: 600; }
.entry-btn.na-btn.active { background: var(--text-tertiary); color: var(--surface-2); }
.entry-num-input {
  width: 52px; height: 30px; text-align: center; border-radius: 8px;
  border: 1px solid var(--line); background: var(--inset-bg); color: var(--text-primary);
  font-family: inherit; font-size: 13px; font-weight: 700; -moz-appearance: textfield;
}
.entry-num-input::-webkit-outer-spin-button, .entry-num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.entry-num-input:disabled { opacity: 0.4; }
.entry-auto-badge {
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-tertiary);
  background: var(--inset-bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
}

/* habit list editor */
.habit-config-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 0; border-bottom: 1px solid var(--line-soft);
}
.habit-config-row:last-child { border-bottom: none; }
.habit-config-main { flex: 1; min-width: 0; }
.habit-config-label-input {
  width: 100%; background: var(--inset-bg); border: 1px solid var(--line); color: var(--text-primary);
  font-family: inherit; font-size: 13px; padding: 8px 10px; border-radius: 8px; outline: none; margin-bottom: 6px;
}
/* flex-wrap so manual_numeric's extra goal-stepper + unit fields (on
   top of the type select + points input every row already has) wrap
   to a second line on narrow screens instead of overflowing — same
   fix as gym.html's day-type tab row (Phase B). */
.habit-config-meta-row { display: flex; flex-wrap: wrap; gap: 6px; }
.habit-config-meta-row select, .habit-config-meta-row input[type="number"], .habit-config-meta-row input[type="text"] {
  background: var(--inset-bg); border: 1px solid var(--line); color: var(--text-primary);
  font-family: inherit; font-size: 11.5px; padding: 6px 8px; border-radius: 7px; outline: none;
}
.habit-config-meta-row input[type="number"] { width: 60px; -moz-appearance: textfield; }
.hc-numeric-goal { display: inline-flex; align-items: center; gap: 4px; }
.hc-numeric-goal .habit-config-icon-btn { width: 22px; height: 22px; font-size: 11px; }
.hc-numeric-goal input.hc-goal { width: 40px !important; text-align: center; }
.habit-config-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.habit-config-icon-btn {
  width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--inset-bg); color: var(--text-tertiary); font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.habit-config-icon-btn:hover { color: var(--text-primary); }
.habit-config-add-btn {
  width: 100%; padding: 10px; margin-top: 10px; border-radius: 10px; border: 1px dashed var(--line);
  background: transparent; color: var(--text-tertiary); font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.habit-config-add-btn:hover { color: var(--text-primary); border-color: var(--text-tertiary); }
.habit-config-name { font-size: 13.5px; font-weight: 700; color: var(--text-primary); }
.habit-config-summary { font-size: 11.5px; color: var(--text-tertiary); margin-top: 3px; }

/* ===== Add/edit habit modal (Phase 2) — mirrors main.html's General
   Settings modal shell exactly, so it looks consistent app-wide. ===== */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
  z-index: 200; align-items: center; justify-content: center; padding: 20px;
}
.modal-bg.show { display: flex; }
.modal {
  width: 100%; max-width: 440px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px; max-height: 88vh; overflow-y: auto;
  box-shadow: var(--shadow-card);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.modal-head h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--text-primary); }
.modal-close {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--line); background: transparent;
  color: var(--text-tertiary); font-size: 16px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.modal-close:hover { color: var(--text-primary); border-color: var(--text-tertiary); }
.hf-field { margin-bottom: 14px; }
.hf-label { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 6px; }
.hf-input {
  width: 100%; background: var(--inset-bg); border: 1px solid var(--line); color: var(--text-primary);
  font-family: inherit; font-size: 14px; padding: 10px 12px; border-radius: 9px; outline: none;
}
.hf-field-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.hf-field-row[hidden] { display: none !important; }
.hf-field-row .hf-field { margin-bottom: 0; flex: 1; min-width: 80px; }
.hf-toggle-row { display: flex; gap: 8px; }
.hf-toggle-btn {
  flex: 1; padding: 10px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--inset-bg); color: var(--text-secondary); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
}
.hf-toggle-btn.active { background: linear-gradient(180deg, var(--btn-primary-a), var(--btn-primary-b)); color: var(--btn-primary-text); border-color: transparent; }
.hf-subfield { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
.hf-subfield[hidden] { display: none !important; }
.hf-inline-note { font-size: 11.5px; color: var(--text-tertiary); }
.hf-day-row { display: flex; flex-wrap: wrap; gap: 6px; }
.hf-day-btn {
  width: 40px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--inset-bg); color: var(--text-secondary); font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
}
.hf-day-btn.active { background: linear-gradient(180deg, var(--btn-primary-a), var(--btn-primary-b)); color: var(--btn-primary-text); border-color: transparent; }
.hf-advanced-toggle {
  width: 100%; text-align: left; padding: 10px 0; border: 0; background: transparent;
  color: var(--text-tertiary); font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  border-top: 1px solid var(--line-soft); margin-top: 4px;
}
.hf-advanced-toggle:hover { color: var(--text-primary); }
.hf-advanced-body { padding-top: 6px; }
.hf-labeled-input { display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; font-weight: 700; color: var(--text-tertiary); flex: 1; min-width: 90px; }
.hf-labeled-input input, .hf-labeled-input select {
  background: var(--inset-bg); border: 1px solid var(--line); color: var(--text-primary);
  font-family: inherit; font-size: 13px; padding: 8px 9px; border-radius: 8px; outline: none;
}

/* ===== Consistency grid + streak stats (Phase 3) ===== */
.consistency-card { margin-bottom: 12px; }
.consistency-card:last-child { margin-bottom: 0; }
.consistency-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.consistency-name { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.consistency-badge { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); flex-shrink: 0; }
.consistency-scroll { overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
.consistency-grid { display: flex; gap: 4px; width: max-content; }
.consistency-cell {
  width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0;
  background: var(--inset-bg); border: 1px solid var(--line);
}
.consistency-cell.filled { border-color: transparent; }
.consistency-cell.na {
  background-image: repeating-linear-gradient(45deg, var(--text-tertiary) 0, var(--text-tertiary) 1.5px, transparent 1.5px, transparent 5px);
  opacity: 0.45;
}
.consistency-stats { display: flex; gap: 8px; margin-top: 12px; }
.consistency-stat { flex: 1; text-align: center; background: var(--inset-bg); border-radius: 10px; padding: 8px 4px; }
.consistency-stat-value { font-size: 17px; font-weight: 800; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.consistency-stat-label { font-size: 9px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-tertiary); margin-top: 2px; }
.consistency-empty-note { font-size: 12px; color: var(--text-tertiary); font-style: italic; padding: 4px 2px; }

@media (max-width: 480px) {
  body { padding: max(20px, env(safe-area-inset-top)) 14px 50px; }
  .gm-card { padding: 16px; }
  .habits-summary-pct { font-size: 32px; }
}
</style>
</head>
<body>
<div class="page">

  <div class="dash-header">
    <div class="day-nav" id="habitsDayNav">
      <button type="button" class="day-nav-btn" id="habitsDayPrev" aria-label="Previous day">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span class="day-nav-label" id="habitsDayLabel">Today</span>
      <button type="button" class="day-nav-btn" id="habitsDayNext" aria-label="Next day">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <h1 class="dash-title">Habits</h1>
  </div>

  <div class="gm-card" id="habitsSummaryCard">
    <div class="habits-summary-row">
      <div class="habits-summary-pct" id="habitsSummaryPct">—</div>
      <div class="habits-summary-text">
        <div class="habits-summary-title" id="habitsSummaryTitle">Loading…</div>
        <div class="habits-summary-sub" id="habitsSummarySub">—</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title" id="entrySectionTitle">Today's Habits</div>
    <div class="gm-card">
      <div id="nightlyEntryList"></div>
      <div class="save-btn-row">
        <button type="button" class="save-btn" id="nightlyEntrySaveBtn">Save</button>
        <span class="save-confirm" id="nightlyEntryConfirm">Saved ✓</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Consistency</div>
    <div id="consistencyList"></div>
  </div>

  <div class="section">
    <div class="section-title">Manage Habits</div>
    <div class="gm-card">
      <div id="habitConfigList"></div>
      <button type="button" class="habit-config-add-btn" id="habitConfigAddBtn">+ Add habit</button>
    </div>
  </div>

</div>

<!-- Add/edit habit modal (Phase 2) — same form for both: opening it
     via "+ Add habit" starts blank with sensible defaults already
     filled in (Build, Daily, goal 1 "times", 5 points, no Advanced),
     so creating a plain habit is name -> Save, no other required
     taps. Editing pre-fills every field from the habit being edited. -->
<div class="modal-bg" id="habitFormModalBg">
  <div class="modal">
    <div class="modal-head">
      <h3 id="habitFormTitle">New habit</h3>
      <button type="button" class="modal-close" id="habitFormCloseBtn" aria-label="Close">×</button>
    </div>

    <div class="hf-field">
      <label class="hf-label">Name</label>
      <input type="text" id="hfName" class="hf-input" placeholder="e.g. Read" autocomplete="off">
    </div>

    <div class="hf-field">
      <label class="hf-label">I want to</label>
      <div class="hf-toggle-row" id="hfBuildOrQuit">
        <button type="button" class="hf-toggle-btn active" data-value="build">Build</button>
        <button type="button" class="hf-toggle-btn" data-value="quit">Quit</button>
      </div>
    </div>

    <div class="hf-field">
      <label class="hf-label">Frequency</label>
      <select id="hfFrequencyType" class="hf-input">
        <option value="daily">Daily</option>
        <option value="timesPerWeek">X times per week</option>
        <option value="specificDays">Specific days</option>
      </select>
      <div class="hf-subfield" id="hfTimesPerWeekField" hidden>
        <input type="number" id="hfTimesPerWeek" class="hf-input" min="1" max="7" value="3" style="width:70px">
        <span class="hf-inline-note">times / week</span>
      </div>
      <div class="hf-subfield" id="hfSpecificDaysField" hidden>
        <div class="hf-day-row" id="hfDayToggles"></div>
      </div>
    </div>

    <div class="hf-field-row">
      <div class="hf-field">
        <label class="hf-label">Daily goal</label>
        <span class="hc-numeric-goal">
          <button type="button" class="habit-config-icon-btn" id="hfGoalDec">−</button>
          <input type="number" id="hfGoal" class="hc-goal" min="1" value="1">
          <button type="button" class="habit-config-icon-btn" id="hfGoalInc">+</button>
        </span>
      </div>
      <div class="hf-field">
        <label class="hf-label">Unit</label>
        <input type="text" id="hfUnit" class="hf-input" value="times">
      </div>
      <div class="hf-field">
        <label class="hf-label">Points</label>
        <input type="number" id="hfPoints" class="hf-input" min="0" value="5">
      </div>
    </div>

    <button type="button" class="hf-advanced-toggle" id="hfAdvancedToggleBtn">Advanced ▾</button>
    <div class="hf-advanced-body" id="hfAdvancedBody" hidden>
      <div class="hf-field">
        <label class="hf-label">Special behavior</label>
        <select id="hfAdvancedType" class="hf-input">
          <option value="none">None</option>
          <option value="zeroTolerance">Zero tolerance</option>
          <option value="weeklyCap">Weekly limit</option>
          <option value="autoThreshold">Auto-import from</option>
        </select>
      </div>
      <div class="hf-field" id="hfZeroToleranceNote" hidden>
        <div class="hf-inline-note">Missing this habit on any day flags it in the daily summary — no partial credit toward it.</div>
      </div>
      <div class="hf-field-row" id="hfWeeklyCapFields" hidden>
        <label class="hf-labeled-input">Allowed / week<input type="number" id="hfWcAllowed" min="0" value="2"></label>
        <label class="hf-labeled-input">Weekly penalty<input type="number" id="hfWcWeeklyPenalty" min="0" value="0"></label>
        <label class="hf-labeled-input">Daily penalty<input type="number" id="hfWcDailyPenalty" min="0" value="0"></label>
      </div>
      <div class="hf-field-row" id="hfAutoThresholdFields" hidden>
        <label class="hf-labeled-input">Source
          <select id="hfAtSource"></select>
        </label>
        <label class="hf-labeled-input">Operator
          <select id="hfAtOperator">
            <option value=">=">&gt;=</option>
            <option value=">">&gt;</option>
            <option value="<=">&lt;=</option>
            <option value="<">&lt;</option>
            <option value="==">==</option>
          </select>
        </label>
        <label class="hf-labeled-input">Threshold<input type="number" id="hfAtValue" value="80"></label>
      </div>
    </div>

    <div class="save-btn-row" style="margin-top:18px">
      <button type="button" class="save-btn" id="hfSaveBtn">Save</button>
      <button type="button" class="habit-config-icon-btn" id="hfDeleteBtn" title="Delete habit" style="display:none; width:auto; padding:0 12px; color:var(--danger);">Delete</button>
      <span class="save-confirm" id="hfConfirm">Saved ✓</span>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  const $ = (id) => document.getElementById(id);

  // ---------- date helpers (DayLib-backed, see daylib.js) ----------
  function mondayOfKey(dateKeyStr) {
    const date = DayLib.parseDateKey(dateKeyStr);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    date.setDate(date.getDate() + diff);
    return DayLib.plainDateKey(date);
  }
  function addDaysKey(dateKeyStr, n) {
    const d = DayLib.parseDateKey(dateKeyStr);
    d.setDate(d.getDate() + n);
    return DayLib.plainDateKey(d);
  }
  // Guard was 8 (enough for "at most one week") before Phase 3's
  // consistency grid needed a real 30+ day range out of this same
  // function — raised to a generous year-plus ceiling that's still a
  // safety valve against a malformed fromKey/toKey, not a real limit.
  function datesFromTo(fromKey, toKey) {
    const out = [];
    let k = fromKey;
    let guard = 0;
    while (k <= toKey && guard++ < 400) { out.push(k); k = addDaysKey(k, 1); }
    return out;
  }

  const todayActive = DayLib.effectiveDateKey();
  const weekMondayActive = mondayOfKey(todayActive);

  function getSecret() { try { return localStorage.getItem('dashboard:secret') || ''; } catch (e) { return ''; } }
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // ---------- default habit config — kept identical to main.html's
  // score hero card, which is the other reader of this same
  // habit_config row. If you change the defaults, change both. New
  // unified schema (Phase 1 of the Habits redesign): no more internal
  // "type" — every habit is buildOrQuit + frequency + dailyGoal + unit
  // + points, with an optional "advanced" object for the three power-
  // user behaviors (zeroTolerance / weeklyCap / autoThreshold) that
  // used to be their own "types". ----------
  function defaultHabitConfig() {
    return {
      habits: [
        { id: 'sleep_wake',   name: 'Slept early & woke early',    points: 10, buildOrQuit: 'build', frequency: { type: 'daily' }, dailyGoal: 2, unit: 'times', advanced: null },
        { id: 'brush_teeth',  name: 'Brush teeth (AM + PM)',       points: 4,  buildOrQuit: 'build', frequency: { type: 'daily' }, dailyGoal: 2, unit: 'times', advanced: null },
        { id: 'productivity', name: '1h focused productivity',     points: 8,  buildOrQuit: 'build', frequency: { type: 'daily' }, dailyGoal: 1, unit: 'times', advanced: null },
        { id: 'screen_time',  name: 'Screen time under 6h',        points: 8,  buildOrQuit: 'build', frequency: { type: 'daily' }, dailyGoal: 1, unit: 'times', advanced: null },
        { id: 'plan_day',     name: 'Plan the day',                points: 5,  buildOrQuit: 'build', frequency: { type: 'daily' }, dailyGoal: 1, unit: 'times', advanced: null },
        { id: 'walk_dog',     name: 'Walk the dog (AM + PM)',      points: 6,  buildOrQuit: 'build', frequency: { type: 'daily' }, dailyGoal: 2, unit: 'times', advanced: null },
        { id: 'no_phone_30',  name: 'No phone first 30 min',       points: 6,  buildOrQuit: 'build', frequency: { type: 'daily' }, dailyGoal: 1, unit: 'times', advanced: null },
        { id: 'no_porn',      name: 'No porn',                     points: 15, buildOrQuit: 'quit',  frequency: { type: 'daily' }, dailyGoal: 1, unit: 'times', advanced: { zeroTolerance: true } },
        { id: 'no_fap',       name: 'No fap',                      points: 15, buildOrQuit: 'quit',  frequency: { type: 'daily' }, dailyGoal: 1, unit: 'times', advanced: { weeklyCap: { allowedPerWeek: 2, weeklyPenalty: 15, dailyPenalty: 5 } } },
        { id: 'read',         name: 'Read',                        points: 4,  buildOrQuit: 'build', frequency: { type: 'daily' }, dailyGoal: 1, unit: 'times', advanced: null },
        { id: 'stretch',      name: 'Stretching (morning + night)',points: 6,  buildOrQuit: 'build', frequency: { type: 'daily' }, dailyGoal: 2, unit: 'times', advanced: null },
      ],
    };
  }

  // Defensive adapter — same mapping the one-time production migration
  // used to convert the user's real habit_config to this shape, kept
  // here permanently as a safety net (e.g. a stale cached copy from
  // before the migration). See main.html's identical copy for the
  // full reasoning.
  function normalizeHabit(h) {
    h = h || {};
    if (h.dailyGoal != null || h.buildOrQuit || h.advanced !== undefined) {
      return {
        id: h.id,
        name: h.name || h.label || '',
        points: Number(h.points) || 0,
        buildOrQuit: h.buildOrQuit === 'quit' ? 'quit' : 'build',
        frequency: h.frequency || { type: 'daily' },
        dailyGoal: Number(h.dailyGoal) || 1,
        unit: typeof h.unit === 'string' ? h.unit : 'times',
        advanced: h.advanced || null,
      };
    }
    const base = { id: h.id, name: h.label || '', points: Number(h.points) || 0, frequency: { type: 'daily' } };
    if (h.type === 'manual_count2') return { ...base, buildOrQuit: 'build', dailyGoal: 2, unit: 'times', advanced: null };
    if (h.type === 'manual_numeric') return { ...base, buildOrQuit: 'build', dailyGoal: Number(h.goal) || 1, unit: (h.unit != null ? h.unit : ''), advanced: null };
    if (h.type === 'zero_tolerance') return { ...base, buildOrQuit: 'quit', dailyGoal: 1, unit: 'times', advanced: { zeroTolerance: true } };
    if (h.type === 'weekly_cap') return { ...base, buildOrQuit: 'quit', dailyGoal: 1, unit: 'times', advanced: { weeklyCap: { allowedPerWeek: h.weeklyCap, weeklyPenalty: h.weeklyPenaltyPoints, dailyPenalty: h.perExtraDayPenaltyPoints } } };
    if (h.type === 'auto_threshold') return { ...base, buildOrQuit: 'build', dailyGoal: 1, unit: 'times', advanced: { autoThreshold: { source: h.source, operator: h.operator, value: h.threshold } } };
    return { ...base, buildOrQuit: 'build', dailyGoal: 1, unit: 'times', advanced: null };
  }

  // ---------- server: habit_config + daily_habits (api/sync-state.js's
  // resource= dispatch — same endpoint main.html's score card uses) ----------
  async function fetchHabitConfig() {
    const secret = getSecret();
    if (!secret) return defaultHabitConfig();
    let config = null;
    try {
      const r = await fetch('/api/sync-state?resource=habit-config&secret=' + encodeURIComponent(secret));
      const j = await r.json();
      if (j && j.ok && j.config && Array.isArray(j.config.habits) && j.config.habits.length) config = j.config;
    } catch (e) {}
    if (!config) config = defaultHabitConfig();
    return { habits: config.habits.map(normalizeHabit) };
  }
  async function saveHabitConfig(config) {
    const secret = getSecret();
    if (!secret) throw new Error('Set your dashboard secret first');
    const r = await fetch('/api/sync-state?resource=habit-config&secret=' + encodeURIComponent(secret), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resource: 'habit-config', config }),
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error((j && j.error) || 'save failed');
  }
  async function fetchDailyHabitsRange(fromKey, toKey) {
    const secret = getSecret();
    const out = {};
    if (!secret) return out;
    try {
      const r = await fetch('/api/sync-state?resource=daily-habits&secret=' + encodeURIComponent(secret) + '&from=' + fromKey + '&to=' + toKey);
      const j = await r.json();
      if (j && j.ok && Array.isArray(j.days)) j.days.forEach((row) => { out[row.date] = row.entries; });
    } catch (e) {}
    return out;
  }
  async function saveDailyHabits(dateKeyStr, entries) {
    const secret = getSecret();
    if (!secret) throw new Error('Set your dashboard secret first');
    const r = await fetch('/api/sync-state?resource=daily-habits&secret=' + encodeURIComponent(secret), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resource: 'daily-habits', date: dateKeyStr, entries }),
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error((j && j.error) || 'save failed');
  }

  // ---------- manual habits scoring — same formula as main.html's
  // score hero card (see its header comment for the full rationale on
  // zero_tolerance/weekly_cap); kept in sync by hand, not shared, per
  // this project's no-shared-module convention for page-specific logic
  // (daylib.js is the one exception, being pure date math). ----------
  // Unified formula for the new schema (no more internal "type" — see
  // main.html's identical copy for the full reasoning): a boolean
  // entryVal (still how former-binary/zero_tolerance/weekly_cap habits
  // store "done") coerces via Number() to 1 or 0, reproducing the old
  // binary formula exactly; a numeric entryVal against its matching
  // dailyGoal reproduces the old count2/numeric formulas exactly.
  function manualHabitFraction(habit, entryVal) {
    return Math.max(0, Math.min(1, (Number(entryVal) || 0) / (Number(habit.dailyGoal) || 1)));
  }
  // auto_threshold habits are evaluated against real data sources
  // (WHOOP/Cronometer/Water/Training) that only main.html's score
  // engine actually fetches (see main.html's computeAutoThresholdSources
  // — reuses data it's already pulling for the other auto-sourced
  // categories, plus one gated WHOOP read). This page is manual-entry-
  // only and has no autoSources to pass in, so these always fall
  // through to the "unlogged" branch below in THIS page's own summary
  // widget — an intentional, documented gap: the "Today's Score" circle
  // on main.html is the one place these habits are actually scored.
  function compareThreshold(value, operator, threshold) {
    const v = Number(value), t = Number(threshold);
    switch (operator) {
      case '>': return v > t;
      case '<=': return v <= t;
      case '<': return v < t;
      case '==': return v === t;
      default: return v >= t;
    }
  }
  // Takes the habit itself now (not just its id) — needs dailyGoal to
  // judge "occurred" the same fraction-based way manualHabitFraction
  // does, since entries can now be either a legacy boolean (true/false,
  // from before this migration) or a new number typed into the unified
  // stepper. Falling short of dailyGoal (fraction < 1) is "occurred"
  // either way: Number(false)=0 -> 0/1=0 -> <1; Number(true)=1 -> 1/1=1
  // -> not <1; a new "0" entry -> 0/1=0 -> <1 — all three read as
  // intended without special-casing which format a given day's entry
  // happens to be in.
  function weekOccurrenceCount(habit, entriesByDate, fromKey, toKey) {
    let n = 0;
    datesFromTo(fromKey, toKey).forEach((k) => {
      const e = entriesByDate[k] && entriesByDate[k][habit.id];
      if (e && e.na !== true && manualHabitFraction(habit, e.value) < 1) n++;
    });
    return n;
  }
  function scoreManualHabitsForDate(habitConfig, entriesByDate, dateActiveKey, weekMondayActiveKey, autoSources) {
    const entry = entriesByDate[dateActiveKey] || null;
    let earned = 0, possible = 0;
    const flags = [];
    (habitConfig.habits || []).forEach((h) => {
      const advanced = h.advanced || null;
      if (advanced && advanced.autoThreshold) {
        const cfg = advanced.autoThreshold;
        const src = (autoSources && autoSources[cfg.source]) || { available: false };
        if (!src.available) return; // see compareThreshold's comment above — always the case on this page
        if (compareThreshold(src.value, cfg.operator, cfg.value)) { earned += h.points; }
        possible += h.points;
        return;
      }
      const e = entry && entry[h.id];
      if (!e || e.na === true) return; // unlogged or N/A — excluded, not scored 0
      if (advanced && advanced.weeklyCap) {
        const cfg = advanced.weeklyCap;
        possible += h.points;
        // "Abstained today" = hit the daily goal (fraction 1), same
        // fraction check as everywhere else — handles both a legacy
        // boolean {value:true} and a new numeric {value:1} entry.
        if (manualHabitFraction(h, e.value) >= 1) { earned += h.points; return; }
        const countThroughToday = weekOccurrenceCount(h, entriesByDate, weekMondayActiveKey, dateActiveKey);
        const over = Math.max(0, countThroughToday - (cfg.allowedPerWeek || 0));
        earned += Math.max(0, h.points - over * (cfg.dailyPenalty || 0));
        return;
      }
      const frac = manualHabitFraction(h, e.value);
      earned += frac * h.points; possible += h.points;
      if (advanced && advanced.zeroTolerance && frac === 0) flags.push(h.name);
    });
    return { earned, possible, flags };
  }

  let currentHabitConfig = null;
  let entriesByDate = {};

  // ---------- history navigation (Phase E) — same day-by-day pattern as
  // Cronometer (health.html): back/forward arrows only, defaults to
  // today via DayLib.effectiveDateKey() (app-wide setting — NOT
  // main.html's score-card-only override), forward disabled at today.
  // Governs BOTH the summary card above and the entry list below, since
  // they're the same underlying data just displayed two ways. Unlike
  // Cronometer, this is editable for any day, not just viewable — past
  // entries are stored exactly the same way as today's (saveDailyHabits
  // already takes an arbitrary date), so retroactively logging a missed
  // day falls out for free rather than needing a separate read-only mode. ----------
  let viewDateKey = todayActive;
  const dayPrevBtn = $('habitsDayPrev');
  const dayNextBtn = $('habitsDayNext');
  const dayLabelEl = $('habitsDayLabel');
  function formatDayLabel(dateKey) {
    if (dateKey === todayActive) return 'Today';
    if (dateKey === addDaysKey(todayActive, -1)) return 'Yesterday';
    return DayLib.parseDateKey(dateKey).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function updateDayNavUI() {
    dayLabelEl.textContent = formatDayLabel(viewDateKey);
    dayNextBtn.disabled = viewDateKey >= todayActive;
    $('entrySectionTitle').textContent = formatDayLabel(viewDateKey) + "'s Habits";
  }
  // Entries are fetched a week at a time (see init()'s existing
  // Monday-to-today range) because weekly_cap habits need the whole
  // week-so-far to score correctly — not just the single viewed day.
  // Reused here so navigating to a day outside the already-loaded range
  // pulls in its whole week rather than one isolated day.
  const fetchedRangeDates = new Set();
  function markFetched(fromKey, toKey) { datesFromTo(fromKey, toKey).forEach((k) => fetchedRangeDates.add(k)); }
  async function ensureEntriesForDate(dateKey) {
    if (fetchedRangeDates.has(dateKey)) return;
    const monday = mondayOfKey(dateKey);
    const fetched = await fetchDailyHabitsRange(monday, dateKey);
    Object.assign(entriesByDate, fetched);
    markFetched(monday, dateKey);
  }
  async function goToDate(dateKey) {
    viewDateKey = dateKey;
    await ensureEntriesForDate(viewDateKey);
    updateDayNavUI();
    renderNightlyEntry();
    await renderSummary();
  }
  dayPrevBtn.addEventListener('click', () => goToDate(addDaysKey(viewDateKey, -1)));
  dayNextBtn.addEventListener('click', () => {
    if (viewDateKey >= todayActive) return;
    goToDate(addDaysKey(viewDateKey, 1));
  });

  async function renderSummary() {
    const manual = scoreManualHabitsForDate(currentHabitConfig, entriesByDate, viewDateKey, mondayOfKey(viewDateKey));
    const pct = manual.possible > 0 ? Math.round((manual.earned / manual.possible) * 100) : null;
    const dayWord = viewDateKey === todayActive ? 'today' : 'that day';
    $('habitsSummaryPct').textContent = pct == null ? '—' : pct + '%';
    $('habitsSummaryTitle').textContent = pct == null ? ('Nothing logged yet ' + dayWord) : (pct >= 85 ? 'Crushing it' : pct >= 65 ? 'Solid' : pct >= 40 ? 'Room to improve' : 'Rough day');
    const loggedCount = (currentHabitConfig.habits || []).filter((h) => {
      const e = entriesByDate[viewDateKey] && entriesByDate[viewDateKey][h.id];
      return e && e.na !== true;
    }).length;
    $('habitsSummarySub').textContent = loggedCount + ' of ' + (currentHabitConfig.habits || []).length + ' habits logged ' + dayWord + (manual.flags.length ? ' · ⚠ ' + manual.flags.join(', ') : '');
  }

  // ---------- tonight's entry ----------
  // One unified numeric-stepper control for every habit now (no more
  // separate binary/count2/numeric controls — see manualHabitFraction's
  // comment): dailyGoal:1 behaves like the old Yes/No toggle (0 or 1),
  // dailyGoal:N like a free numeric goal. A legacy boolean entry
  // (existing.value === true/false, from before the Phase 1 migration)
  // displays as 1/0 here — reading it back through manualHabitFraction
  // scores it identically either way.
  function habitControlHtml(h, existing) {
    const na = existing && existing.na === true;
    if (h.advanced && h.advanced.autoThreshold) {
      // No manual control — this page can't evaluate auto-sourced
      // habits itself (see the comment above compareThreshold above).
      // The "Today's Score" circle on main.html auto-completes it from
      // the real data source instead.
      return '<span class="entry-auto-badge">Auto-tracked</span>';
    }
    let v = '';
    if (!na && existing && existing.value != null) {
      v = existing.value === true ? 1 : existing.value === false ? 0 : existing.value;
    }
    return '<div class="entry-habit-controls" data-habit="' + h.id + '" data-type="numeric">' +
      '<button type="button" class="entry-btn num-btn" data-v="dec">−</button>' +
      '<input type="number" class="entry-num-input" inputmode="decimal" min="0" placeholder="0" value="' + escapeHtml(String(v)) + '"' + (na ? ' disabled' : '') + '>' +
      '<button type="button" class="entry-btn num-btn" data-v="inc">+</button>' +
      '<button type="button" class="entry-btn na-btn' + (na ? ' active' : '') + '" data-v="na">N/A</button></div>';
  }
  function renderNightlyEntry() {
    const existingEntry = entriesByDate[viewDateKey] || {};
    const html = (currentHabitConfig.habits || []).map((h) => {
      const adv = h.advanced || null;
      const goalNote = ' <small>Goal: ' + (h.dailyGoal || 1) + (h.unit ? ' ' + escapeHtml(h.unit) : '') + '</small>';
      const advNote = adv && adv.zeroTolerance ? ' <small>Zero tolerance</small>'
        : adv && adv.weeklyCap ? ' <small>Cap: ' + adv.weeklyCap.allowedPerWeek + '/week</small>'
        : adv && adv.autoThreshold ? ' <small>' + escapeHtml(AUTO_SOURCE_LABELS[adv.autoThreshold.source] || adv.autoThreshold.source || '') + ' ' + escapeHtml(adv.autoThreshold.operator || '>=') + ' ' + (adv.autoThreshold.value != null ? adv.autoThreshold.value : 0) + '</small>'
        : goalNote;
      const label = escapeHtml(h.name) + advNote;
      return '<div class="entry-habit-row" data-row="' + h.id + '"><span class="entry-habit-label">' + label + '</span>' + habitControlHtml(h, existingEntry[h.id]) + '</div>';
    }).join('');
    $('nightlyEntryList').innerHTML = html;
    $('nightlyEntryList').querySelectorAll('.entry-habit-controls').forEach((row) => {
      row.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const input = row.querySelector('.entry-num-input');
        const naBtn = row.querySelector('.na-btn');
        if (btn.dataset.v === 'na') {
          const turningOn = !naBtn.classList.contains('active');
          naBtn.classList.toggle('active', turningOn);
          input.disabled = turningOn;
          return;
        }
        naBtn.classList.remove('active');
        input.disabled = false;
        const cur = input.value === '' ? 0 : (Number(input.value) || 0);
        if (btn.dataset.v === 'inc') input.value = String(cur + 1);
        else if (btn.dataset.v === 'dec') input.value = String(Math.max(0, cur - 1));
      });
    });
  }
  $('nightlyEntrySaveBtn').addEventListener('click', async () => {
    const entries = {};
    $('nightlyEntryList').querySelectorAll('.entry-habit-controls').forEach((row) => {
      const habitId = row.dataset.habit;
      const naBtn = row.querySelector('.na-btn');
      if (naBtn && naBtn.classList.contains('active')) { entries[habitId] = { na: true }; return; }
      const input = row.querySelector('.entry-num-input');
      if (!input || input.value === '') return; // left unanswered — stays "unlogged"
      entries[habitId] = { value: Number(input.value) || 0 };
    });
    const btn = $('nightlyEntrySaveBtn');
    btn.disabled = true;
    try {
      await saveDailyHabits(viewDateKey, entries);
      entriesByDate[viewDateKey] = entries;
      $('nightlyEntryConfirm').classList.add('show');
      clearTimeout($('nightlyEntryConfirm')._t);
      $('nightlyEntryConfirm')._t = setTimeout(() => $('nightlyEntryConfirm').classList.remove('show'), 1800);
      await renderSummary();
      renderConsistency();
    } catch (e) {
      alert("Couldn't save: " + (e.message || e));
    } finally {
      btn.disabled = false;
    }
  });

  // ---------- consistency grid + streak stats (Phase 3) ----------
  // Reuses fetchDailyHabitsRange (the exact same per-date read the
  // day-nav above already relies on for entriesByDate) and the
  // date-key helpers at the top of this file — no new data-access
  // path, just a longer range through the same functions.
  const CONSISTENCY_DAYS = 30;
  const consistencyFromKey = addDaysKey(todayActive, -(CONSISTENCY_DAYS - 1));
  async function ensureConsistencyDataLoaded() {
    const fetched = await fetchDailyHabitsRange(consistencyFromKey, todayActive);
    Object.assign(entriesByDate, fetched);
    markFetched(consistencyFromKey, todayActive);
  }
  // Stable per-habit accent, derived from the habit's own id so it
  // never changes across renders/reloads without needing a new stored
  // "color" field on the habit itself.
  const CONSISTENCY_PALETTE = ['#17E88F', '#4DA3FF', '#FFC93C', '#FF6B6B', '#B98CFF', '#FF9F5A', '#3DD9C4', '#F06AC1', '#8FE04A', '#5AA9FF'];
  function colorForHabit(id) {
    const s = String(id || '');
    let hash = 0;
    for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
    return CONSISTENCY_PALETTE[hash % CONSISTENCY_PALETTE.length];
  }
  // Same fraction rule as everywhere else on this page
  // (manualHabitFraction / scoreManualHabitsForDate): 'na' if the day
  // was explicitly marked N/A, 'done' if it hit its daily goal,
  // 'empty' otherwise — including no entry at all, which reads the
  // same as a logged miss (there's no 4th "unknown" state in the spec).
  function dayStatus(habit, dateKey) {
    const e = entriesByDate[dateKey] && entriesByDate[dateKey][habit.id];
    if (e && e.na === true) return 'na';
    if (e && manualHabitFraction(habit, e.value) >= 1) return 'done';
    return 'empty';
  }
  // N/A days are skip-neutral for both streaks: they neither extend
  // nor break a run, and they're excluded from the completion-%
  // denominator too, since "N/A" means the habit didn't apply that
  // day rather than that it was missed.
  function computeHabitStats(habit, dateKeys) {
    let bestStreak = 0, run = 0, applicable = 0, done = 0;
    dateKeys.forEach((k) => {
      const status = dayStatus(habit, k);
      if (status === 'na') return;
      applicable++;
      if (status === 'done') { done++; run++; bestStreak = Math.max(bestStreak, run); }
      else { run = 0; }
    });
    let currentStreak = 0;
    for (let i = dateKeys.length - 1; i >= 0; i--) {
      const status = dayStatus(habit, dateKeys[i]);
      if (status === 'na') continue;
      if (status === 'done') { currentStreak++; continue; }
      break;
    }
    const completionPct = applicable > 0 ? Math.round((done / applicable) * 100) : null;
    return { currentStreak, bestStreak, completionPct };
  }
  function renderConsistency() {
    const dateKeys = datesFromTo(consistencyFromKey, todayActive);
    const allHabits = currentHabitConfig.habits || [];
    // auto_threshold habits are excluded here for the same reason
    // dayStatus/scoreManualHabitsForDate skip them elsewhere on this
    // page: this page never evaluates auto-sourced data (see
    // compareThreshold's header comment), so there's no real
    // completion history to draw for past days either — showing a
    // grid for them would mean fabricating data, not displaying it.
    const trackedHabits = allHabits.filter((h) => !(h.advanced && h.advanced.autoThreshold));
    const autoCount = allHabits.length - trackedHabits.length;
    const cards = trackedHabits.map((h) => {
      const color = colorForHabit(h.id);
      const cells = dateKeys.map((k) => {
        const status = dayStatus(h, k);
        const cls = status === 'done' ? 'filled' : status === 'na' ? 'na' : '';
        const style = status === 'done' ? ' style="background:' + color + '"' : '';
        const label = DayLib.parseDateKey(k).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
        const statusWord = status === 'done' ? 'Done' : status === 'na' ? 'N/A' : 'Not done';
        return '<span class="consistency-cell ' + cls + '" title="' + escapeHtml(label) + ' — ' + statusWord + '"' + style + '></span>';
      }).join('');
      const stats = computeHabitStats(h, dateKeys);
      return '<div class="gm-card consistency-card">' +
        '<div class="consistency-head">' +
        '<span class="consistency-name">' + escapeHtml(h.name) + '</span>' +
        '<span class="consistency-badge">' + (h.buildOrQuit === 'quit' ? 'Quit' : 'Build') + '</span>' +
        '</div>' +
        '<div class="consistency-scroll"><div class="consistency-grid">' + cells + '</div></div>' +
        '<div class="consistency-stats">' +
        '<div class="consistency-stat"><div class="consistency-stat-value">' + stats.currentStreak + '</div><div class="consistency-stat-label">Streak</div></div>' +
        '<div class="consistency-stat"><div class="consistency-stat-value">' + stats.bestStreak + '</div><div class="consistency-stat-label">Best streak</div></div>' +
        '<div class="consistency-stat"><div class="consistency-stat-value">' + (stats.completionPct == null ? '—' : stats.completionPct + '%') + '</div><div class="consistency-stat-label">Completion</div></div>' +
        '</div></div>';
    }).join('');
    const note = autoCount > 0
      ? '<div class="consistency-empty-note">' + autoCount + ' auto-tracked habit' + (autoCount > 1 ? 's' : '') + ' not shown here — see Today\'s Score on Main for those.</div>'
      : '';
    $('consistencyList').innerHTML = (cards || '<div class="consistency-empty-note">No habits yet.</div>') + note;
    // Default every grid's scroll position to the most recent (right-
    // most) day, since that's the end a returning user cares about.
    $('consistencyList').querySelectorAll('.consistency-scroll').forEach((el) => { el.scrollLeft = el.scrollWidth; });
  }

  // ---------- manage habits (Phase 2: dedicated add/edit modal
  // instead of the old always-expanded inline row editor — see
  // habitFormModalBg in the HTML above). Every list mutation
  // (add/edit/delete/reorder) auto-saves to the server immediately
  // instead of requiring a separate bulk "Save" button: that's what
  // makes "name -> Save" a complete, persisted 2-tap creation (plus
  // typing the name) rather than needing a 3rd confirm tap. ----------
  let settingsDraft = null;
  let editingIndex = -1; // -1 while the modal is in "new habit" mode
  // Fixed list of data sources actually available for auto_threshold —
  // verified against this app's real, already-working reads before
  // being offered here (see Phase D report): WHOOP sleep/recovery read
  // the same /api/whoop-data the app already uses elsewhere (read-only,
  // date-checked against today so a stale cached record can't silently
  // count); Cronometer protein/calories are per-metric fractions out of
  // the same sync already powering the Nutrition category; Water and
  // Training reuse the same localStorage-backed categories main.html's
  // score engine already computes. Nothing here is a new, unverified
  // data path.
  const AUTO_SOURCE_LABELS = {
    whoop_sleep: 'WHOOP Sleep %',
    whoop_recovery: 'WHOOP Recovery %',
    crono_protein: 'Cronometer Protein %',
    crono_calories: 'Cronometer Calories %',
    water: 'Water Completion %',
    training: 'Training Session Completed',
  };
  const DAY_OPTIONS = [
    { key: 'mon', label: 'Mo' }, { key: 'tue', label: 'Tu' }, { key: 'wed', label: 'We' },
    { key: 'thu', label: 'Th' }, { key: 'fri', label: 'Fr' }, { key: 'sat', label: 'Sa' }, { key: 'sun', label: 'Su' },
  ];
  $('hfDayToggles').innerHTML = DAY_OPTIONS.map((d) => '<button type="button" class="hf-day-btn" data-day="' + d.key + '">' + d.label + '</button>').join('');
  $('hfAtSource').innerHTML = Object.keys(AUTO_SOURCE_LABELS).map((k) => '<option value="' + k + '">' + escapeHtml(AUTO_SOURCE_LABELS[k]) + '</option>').join('');

  // Advanced-type dropdown value for a habit — derived from which (if
  // any) of the three mutually-exclusive advanced.* keys is present.
  function advancedTypeOf(h) {
    if (h.advanced && h.advanced.zeroTolerance) return 'zeroTolerance';
    if (h.advanced && h.advanced.weeklyCap) return 'weeklyCap';
    if (h.advanced && h.advanced.autoThreshold) return 'autoThreshold';
    return 'none';
  }
  function frequencyLabel(freq) {
    if (freq && freq.type === 'timesPerWeek') return (freq.timesPerWeek || 0) + 'x/week';
    if (freq && freq.type === 'specificDays') return (freq.days || []).map((d) => d.charAt(0).toUpperCase() + d.slice(1, 3)).join(' ') || 'Specific days';
    return 'Daily';
  }
  function habitSummaryLine(h) {
    const advType = advancedTypeOf(h);
    const advLabel = advType === 'zeroTolerance' ? 'Zero tolerance'
      : advType === 'weeklyCap' ? 'Cap ' + ((h.advanced.weeklyCap || {}).allowedPerWeek || 0) + '/wk'
      : advType === 'autoThreshold' ? 'Auto: ' + (AUTO_SOURCE_LABELS[(h.advanced.autoThreshold || {}).source] || (h.advanced.autoThreshold || {}).source || '')
      : '';
    return (h.buildOrQuit === 'quit' ? 'Quit' : 'Build') + ' · ' + frequencyLabel(h.frequency) + ' · Goal ' + h.dailyGoal + (h.unit ? ' ' + escapeHtml(h.unit) : '') + ' · ' + h.points + ' pts' + (advLabel ? ' · ' + advLabel : '');
  }
  function renderHabitSettingsList() {
    const html = settingsDraft.habits.map((h, i) => {
      return '<div class="habit-config-row" data-idx="' + i + '">' +
        '<div class="habit-config-main">' +
        '<div class="habit-config-name">' + escapeHtml(h.name) + '</div>' +
        '<div class="habit-config-summary">' + habitSummaryLine(h) + '</div>' +
        '</div>' +
        '<div class="habit-config-actions">' +
        '<button type="button" class="habit-config-icon-btn hc-up" title="Move up">↑</button>' +
        '<button type="button" class="habit-config-icon-btn hc-down" title="Move down">↓</button>' +
        '<button type="button" class="habit-config-icon-btn hc-edit" title="Edit">✎</button>' +
        '</div></div>';
    }).join('');
    $('habitConfigList').innerHTML = html;
  }
  // Shared by every mutation path (add/edit/delete/reorder): persists
  // settingsDraft to the server, then makes it the new source of truth
  // and re-renders everything that reads habit_config on this page.
  async function persistDraft() {
    await saveHabitConfig(settingsDraft);
    currentHabitConfig = JSON.parse(JSON.stringify(settingsDraft));
    renderHabitSettingsList();
    renderNightlyEntry();
    await renderSummary();
    renderConsistency();
  }
  $('habitConfigList').addEventListener('click', async (e) => {
    const row = e.target.closest('.habit-config-row');
    if (!row) return;
    const idx = Number(row.dataset.idx);
    if (e.target.closest('.hc-up') && idx > 0) {
      const [h] = settingsDraft.habits.splice(idx, 1); settingsDraft.habits.splice(idx - 1, 0, h);
      try { await persistDraft(); } catch (err) { alert("Couldn't save: " + (err.message || err)); }
    } else if (e.target.closest('.hc-down') && idx < settingsDraft.habits.length - 1) {
      const [h] = settingsDraft.habits.splice(idx, 1); settingsDraft.habits.splice(idx + 1, 0, h);
      try { await persistDraft(); } catch (err) { alert("Couldn't save: " + (err.message || err)); }
    } else if (e.target.closest('.hc-edit')) {
      openHabitForm(idx);
    }
  });

  // ---------- add/edit habit modal ----------
  function setBuildOrQuit(value) {
    $('hfBuildOrQuit').querySelectorAll('.hf-toggle-btn').forEach((b) => b.classList.toggle('active', b.dataset.value === value));
  }
  function getBuildOrQuit() {
    const active = $('hfBuildOrQuit').querySelector('.hf-toggle-btn.active');
    return active && active.dataset.value === 'quit' ? 'quit' : 'build';
  }
  $('hfBuildOrQuit').addEventListener('click', (e) => {
    const btn = e.target.closest('.hf-toggle-btn');
    if (btn) setBuildOrQuit(btn.dataset.value);
  });
  function setSpecificDays(days) {
    $('hfDayToggles').querySelectorAll('.hf-day-btn').forEach((b) => b.classList.toggle('active', days.indexOf(b.dataset.day) !== -1));
  }
  function getSpecificDays() {
    return Array.from($('hfDayToggles').querySelectorAll('.hf-day-btn.active')).map((b) => b.dataset.day);
  }
  $('hfDayToggles').addEventListener('click', (e) => {
    const btn = e.target.closest('.hf-day-btn');
    if (btn) btn.classList.toggle('active');
  });
  function updateFrequencyFieldsVisibility() {
    const type = $('hfFrequencyType').value;
    $('hfTimesPerWeekField').hidden = type !== 'timesPerWeek';
    $('hfSpecificDaysField').hidden = type !== 'specificDays';
  }
  $('hfFrequencyType').addEventListener('change', updateFrequencyFieldsVisibility);
  function updateAdvancedFieldsVisibility() {
    const type = $('hfAdvancedType').value;
    $('hfZeroToleranceNote').hidden = type !== 'zeroTolerance';
    $('hfWeeklyCapFields').hidden = type !== 'weeklyCap';
    $('hfAutoThresholdFields').hidden = type !== 'autoThreshold';
  }
  $('hfAdvancedType').addEventListener('change', updateAdvancedFieldsVisibility);
  $('hfAdvancedToggleBtn').addEventListener('click', () => {
    const body = $('hfAdvancedBody');
    body.hidden = !body.hidden;
    $('hfAdvancedToggleBtn').textContent = 'Advanced ' + (body.hidden ? '▾' : '▴');
  });
  $('hfGoalInc').addEventListener('click', () => { $('hfGoal').value = (Number($('hfGoal').value) || 0) + 1; });
  $('hfGoalDec').addEventListener('click', () => { $('hfGoal').value = Math.max(1, (Number($('hfGoal').value) || 1) - 1); });

  // Resets every field to the defaults a brand-new plain habit gets —
  // this is what makes "+ Add habit" -> type a name -> Save enough to
  // create a fully-usable daily habit with no other required taps.
  function resetHabitForm() {
    $('hfName').value = '';
    setBuildOrQuit('build');
    $('hfFrequencyType').value = 'daily';
    $('hfTimesPerWeek').value = 3;
    setSpecificDays([]);
    updateFrequencyFieldsVisibility();
    $('hfGoal').value = 1;
    $('hfUnit').value = 'times';
    $('hfPoints').value = 5;
    $('hfAdvancedType').value = 'none';
    $('hfWcAllowed').value = 2; $('hfWcWeeklyPenalty').value = 0; $('hfWcDailyPenalty').value = 0;
    $('hfAtSource').value = 'water'; $('hfAtOperator').value = '>='; $('hfAtValue').value = 80;
    updateAdvancedFieldsVisibility();
    $('hfAdvancedBody').hidden = true;
    $('hfAdvancedToggleBtn').textContent = 'Advanced ▾';
  }
  function openHabitForm(idx) {
    editingIndex = idx == null ? -1 : idx;
    resetHabitForm();
    $('hfDeleteBtn').style.display = editingIndex === -1 ? 'none' : '';
    if (editingIndex === -1) {
      $('habitFormTitle').textContent = 'New habit';
    } else {
      const h = settingsDraft.habits[editingIndex];
      $('habitFormTitle').textContent = 'Edit habit';
      $('hfName').value = h.name;
      setBuildOrQuit(h.buildOrQuit === 'quit' ? 'quit' : 'build');
      const freq = h.frequency || { type: 'daily' };
      $('hfFrequencyType').value = freq.type || 'daily';
      if (freq.type === 'timesPerWeek') $('hfTimesPerWeek').value = freq.timesPerWeek || 3;
      if (freq.type === 'specificDays') setSpecificDays(freq.days || []);
      updateFrequencyFieldsVisibility();
      $('hfGoal').value = h.dailyGoal || 1;
      $('hfUnit').value = h.unit || '';
      $('hfPoints').value = h.points || 0;
      const advType = advancedTypeOf(h);
      $('hfAdvancedType').value = advType;
      if (advType === 'weeklyCap') {
        const wc = h.advanced.weeklyCap || {};
        $('hfWcAllowed').value = wc.allowedPerWeek || 0;
        $('hfWcWeeklyPenalty').value = wc.weeklyPenalty || 0;
        $('hfWcDailyPenalty').value = wc.dailyPenalty || 0;
      } else if (advType === 'autoThreshold') {
        const at = h.advanced.autoThreshold || {};
        $('hfAtSource').value = at.source || 'water';
        $('hfAtOperator').value = at.operator || '>=';
        $('hfAtValue').value = at.value != null ? at.value : 80;
      }
      updateAdvancedFieldsVisibility();
      if (advType !== 'none') { $('hfAdvancedBody').hidden = false; $('hfAdvancedToggleBtn').textContent = 'Advanced ▴'; }
    }
    $('habitFormModalBg').classList.add('show');
    setTimeout(() => $('hfName').focus(), 50);
  }
  function closeHabitForm() { $('habitFormModalBg').classList.remove('show'); }
  $('habitConfigAddBtn').addEventListener('click', () => openHabitForm(-1));
  $('habitFormCloseBtn').addEventListener('click', closeHabitForm);
  $('habitFormModalBg').addEventListener('click', (e) => { if (e.target.id === 'habitFormModalBg') closeHabitForm(); });

  function readHabitFormIntoObject(existingId) {
    const name = $('hfName').value.trim();
    if (!name) { $('hfName').focus(); return null; }
    const freqType = $('hfFrequencyType').value;
    let frequency = { type: 'daily' };
    if (freqType === 'timesPerWeek') frequency = { type: 'timesPerWeek', timesPerWeek: Math.max(1, Number($('hfTimesPerWeek').value) || 1) };
    else if (freqType === 'specificDays') frequency = { type: 'specificDays', days: getSpecificDays() };
    const advType = $('hfAdvancedType').value;
    let advanced = null;
    if (advType === 'zeroTolerance') advanced = { zeroTolerance: true };
    else if (advType === 'weeklyCap') advanced = { weeklyCap: { allowedPerWeek: Number($('hfWcAllowed').value) || 0, weeklyPenalty: Number($('hfWcWeeklyPenalty').value) || 0, dailyPenalty: Number($('hfWcDailyPenalty').value) || 0 } };
    else if (advType === 'autoThreshold') advanced = { autoThreshold: { source: $('hfAtSource').value, operator: $('hfAtOperator').value, value: Number($('hfAtValue').value) || 0 } };
    return {
      id: existingId || ('custom_' + Date.now().toString(36)),
      name,
      buildOrQuit: getBuildOrQuit(),
      frequency,
      dailyGoal: Math.max(1, Number($('hfGoal').value) || 1),
      // No "|| 'times'" fallback here — some real habits (e.g. "Walks")
      // intentionally carry an empty unit, and this must not silently
      // reset it back to "times" on every unrelated edit. New habits
      // already start with "times" pre-filled by resetHabitForm().
      unit: $('hfUnit').value.trim(),
      points: Number($('hfPoints').value) || 0,
      advanced,
    };
  }
  $('hfSaveBtn').addEventListener('click', async () => {
    const existingId = editingIndex === -1 ? null : settingsDraft.habits[editingIndex].id;
    const habit = readHabitFormIntoObject(existingId);
    if (!habit) return; // empty name — left open so the user can fix it
    const btn = $('hfSaveBtn');
    btn.disabled = true;
    const wasNew = editingIndex === -1;
    if (wasNew) settingsDraft.habits.push(habit);
    else settingsDraft.habits[editingIndex] = habit;
    try {
      await persistDraft();
      $('hfConfirm').classList.add('show');
      clearTimeout($('hfConfirm')._t);
      $('hfConfirm')._t = setTimeout(() => { $('hfConfirm').classList.remove('show'); closeHabitForm(); }, 700);
    } catch (err) {
      // roll the draft back to match what's actually on the server —
      // a failed save must not leave settingsDraft ahead of reality
      if (wasNew) settingsDraft.habits.pop();
      else settingsDraft.habits[editingIndex] = JSON.parse(JSON.stringify(currentHabitConfig.habits[editingIndex]));
      alert("Couldn't save: " + (err.message || err));
    } finally {
      btn.disabled = false;
    }
  });
  $('hfDeleteBtn').addEventListener('click', async () => {
    if (editingIndex === -1) return;
    const h = settingsDraft.habits[editingIndex];
    if (!confirm('Delete "' + h.name + '"? This can\'t be undone.')) return;
    const removed = settingsDraft.habits.splice(editingIndex, 1)[0];
    try {
      await persistDraft();
      closeHabitForm();
    } catch (err) {
      settingsDraft.habits.splice(editingIndex, 0, removed);
      alert("Couldn't delete: " + (err.message || err));
    }
  });

  // ---------- init ----------
  (async function init() {
    const [habitConfig, entries] = await Promise.all([
      fetchHabitConfig(),
      fetchDailyHabitsRange(weekMondayActive, todayActive),
    ]);
    currentHabitConfig = habitConfig;
    entriesByDate = entries;
    markFetched(weekMondayActive, todayActive);
    settingsDraft = JSON.parse(JSON.stringify(habitConfig));

    updateDayNavUI();
    renderNightlyEntry();
    renderHabitSettingsList();
    await renderSummary();

    // Consistency grid covers a wider window than the week already
    // fetched above — load whatever of it isn't already covered, then
    // render (this can safely run after the above, since none of it
    // depends on the wider range being loaded yet).
    await ensureConsistencyDataLoaded();
    renderConsistency();
  })();
});
</script>
</body>
</html>
